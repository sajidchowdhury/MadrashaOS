# MadrashaOS — PostgreSQL Database (Docker Compose)
#
# Session B0.1 — PostgreSQL Setup + Connection
#
# Usage:
#   docker compose up -d          # start PostgreSQL
#   docker compose logs -f db     # view logs
#   docker compose down           # stop (keeps data)
#   docker compose down -v        # stop + DELETE all data
#
# Connection string (matches .env):
#   postgresql://madrashaos:secret@localhost:5432/madrashaos?schema=public

services:
  db:
    image: postgres:16-alpine
    container_name: madrashaos-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: madrashaos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: madrashaos
      # Optional: tune for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      # Persistent data storage (survives container restarts)
      - madrashaos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madrashaos -d madrashaos"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Optional: uncomment to enable query logging
    # command: postgres -c log_statement=all -c log_duration=on

volumes:
  madrashaos_pgdata:
    driver: local
